# Accessibility audit — axe-core / WCAG 2.2 AA
#
# Audits every built VitePress sitemap page with axe-core's WCAG A/AA rules.
# Automated findings complement, but never replace, manual accessibility review.
#
# Triggers:
#   - every pull_request touching the same paths
#   - workflow_dispatch (manual run)
#
# Strategy:
#   1. Build the docs with `bun run docs:build:a11y` (sets VITEPRESS_HOSTNAME=
#      http://localhost:4173 so the generated sitemap.xml contains localhost
#      URLs that the audit can reach directly)
#   2. Start `vitepress preview` via the shared composite action
#   3. Exercise the audit harness, then scan the full sitemap with up to four workers (one per CPU)
#   4. Publish JSON/Markdown artifacts and a sticky same-repository PR summary
#
# Chrome: Playwright reuses Ubuntu's system Chrome; no browser download.
name: Accessibility audit (WCAG 2.2 AA)

on:
  pull_request:
    paths:
      - "docs/**"
      - ".bun-version"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/a11y.yaml"
      - ".github/actions/start-preview-server/**"
      - "scripts/a11y*.ts"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

# One audit at a time per branch; cancel stale runs on new push.
concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: WCAG 2.2 AA pages audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build docs (a11y — sitemap will use localhost URLs)
        run: bun run docs:build:a11y

      # Shared composite action: starts preview server + waits until ready.
      - name: Start VitePress preview server
        uses: ./.github/actions/start-preview-server

      - name: Test accessibility audit harness and theme semantics
        run: bun run docs:test:a11y --reporter=dot

      - name: Run accessibility audit (axe-core)
        id: audit
        continue-on-error: true
        run: bun run docs:a11y

      - name: Publish job summary
        if: ${{ !cancelled() && steps.audit.outcome != 'skipped' }}
        run: cat a11y-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post / update accessibility report on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.audit.outcome != 'skipped' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: accessibility-audit
          path: a11y-report.md

      - name: Fail if accessibility audit failed
        if: ${{ !cancelled() && steps.audit.outcome == 'failure' }}
        run: |
          echo "::error::Accessibility audit failed — see the report for violations or operational errors"
          exit 1

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: a11y-report
          path: |
            a11y-report.json
            a11y-report.md
          if-no-files-found: ignore
